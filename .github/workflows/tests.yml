name: tests

# Only the engine-free tests run here: control_span.py is pure Python and standard library.
# The engine-shaped tests (test_integration.py, test_real_engine_shape.py,
# test_server_consumer_shape.py) need a real Strata install and its tokenizer, so they run
# locally with STRATA_ROOT set. They are the ones that matter most - see the README.

on:
  push:
  pull_request:

jobs:
  predicate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: compile
        run: python -m py_compile control_span.py serve_with_guard.py probe_guard.py stats_from_log.py
      - name: predicate and escape tests
        run: python test_control_span.py
